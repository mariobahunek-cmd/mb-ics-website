name: Blog draft inventory (publication disabled)

# No schedule, write permission, file moves, commits or pushes.
# Publication requires the exact content hashes and explicit approvals
# described in _editorial/REVIEW-PROCESS.md, followed by a reviewed merge.
# Existing workflow_dispatch callers cannot publish via this workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compatibility input; this workflow is always read-only'
        required: false
        default: 'true'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List draft hashes without publishing
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          drafts = sorted(Path('_drafts').glob('*.md'))
          print('Publication disabled. Review exact file hashes before a separate reviewed merge.')
          for path in drafts:
              print(hashlib.sha256(path.read_bytes()).hexdigest(), path.as_posix())
          print(f'{len(drafts)} draft files; zero files moved; zero commits created.')
          PYTHON
