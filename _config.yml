# mb-ics.com — Jekyll-Konfiguration
# Minimale Konfiguration: Jekyll verarbeitet NUR _posts/ und _layouts/.
# Bestehende HTMLs (index.html, impressum.html, privacy.html, 404.html, og-template.html)
# haben kein Frontmatter und werden von Jekyll als Static Files unverändert ausgeliefert.

title: "mb-ics — SAP S/4HANA Training & Beratung"
description: "SAP MM & SD Zertifizierungstraining und LATAM-Localization-Implikationen für DACH-Berater und internationale Entscheider."
url: "https://mb-ics.com"
author: "Mario Bahunek"
email: "mario@mb-ics.com"
lang: "de"

# Build-Settings
markdown: kramdown
highlighter: rouge
theme: null
plugins:
  - jekyll-seo-tag
  - jekyll-feed
# Hinweis: jekyll-sitemap-Plugin bewusst NICHT verwendet — wir generieren
# /sitemap.xml selbst per Liquid-Template (sitemap.xml im Root), damit auch
# die statischen HTMLs (Hauptseite, Privacy, Impressum) und die Blog-
# Listing-URLs zuverlässig drin landen.

# Permalink-Schema für Blog-Posts
# Jekyll 3 (= GitHub-Pages-Default) unterstützt keine Custom-Permalink-Variablen
# wie :lang. Daher setzt jeder Post seinen Permalink explizit im Frontmatter:
#   permalink: /blog/de/<slug>/   (DE)
#   permalink: /blog/en/<slug>/   (EN)
# Site-weiter permalink ist bewusst ein Standard-Pattern als Fallback.
permalink: /blog/:slug/

# Defaults — nur _posts/ bekommen Layout, alle anderen Files bleiben unverändert
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Mario Bahunek"
  - scope:
      path: ""
    values:
      layout: null

# Excludes — Strategy-Dokumente und Drafts werden NICHT publiziert
# WICHTIG: kein bare "*.md" hier — das Glob matcht in vielen Jekyll-Versionen
# auch _posts/*.md und filtert damit alle Posts aus dem Build raus.
exclude:
  - _strategy/
  - _drafts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - DEV.md
  - .gitignore
  - .github/
  - node_modules/

# keep_files: bewusst leer — sitemap.xml wird jetzt vom Liquid-Template aus
# generiert (Datei mit Frontmatter im Root) und enthält statisch die
# Hauptseite/Privacy/Impressum + dynamisch alle Blog-Posts.

# Sass (falls Blog später eigenes CSS bekommt)
sass:
  style: compressed
